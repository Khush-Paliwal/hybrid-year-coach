<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hybrid Year Coach</title>
<meta name="theme-color" content="#0f1317">
<meta name="description" content="Daily workout, food and progress log for a 52-week hybrid training plan, plus a day-by-day study checklist.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone log. Sticky day header, one card per exercise, fixed bottom tabs.
   Part markers are bumper-plate rings in competition plate colours. */
:root {
  --bg: #0f1317;
  --surface: #171c22;
  --surface-2: #1f262e;
  --line: #2b333d;
  --fg: #e9edf1;
  --muted: #8f9aa6;
  --faint: #5f6975;
  --accent: #4a8df7;
  --accent-fg: #ffffff;
  --accent-soft: rgba(74, 141, 247, 0.16);
  --good: #3fb57f;
  --good-soft: rgba(63, 181, 127, 0.16);
  --warn: #e3a53a;
  --warn-soft: rgba(227, 165, 58, 0.16);
  --bad: #ec6a60;
  --plate-red: #d9473f;
  --plate-blue: #3f7fe6;
  --plate-yellow: #e7bb3a;
  --plate-green: #3ea76a;
  --plate-grey: #aab2bc;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f3f6; --surface: #ffffff; --surface-2: #eceff3; --line: #d8dde3; --fg: #121820; --muted: #5a6571; --faint: #8a949f;
    --accent: #1f6fe0; --accent-fg: #ffffff; --accent-soft: rgba(31, 111, 224, 0.12);
    --good: #1e8a5a; --good-soft: rgba(30, 138, 90, 0.12); --warn: #b07513; --warn-soft: rgba(176, 117, 19, 0.12); --bad: #c8382e;
    --plate-red: #c73a33; --plate-blue: #2f6fd6; --plate-yellow: #d2a21c; --plate-green: #2f9259; --plate-grey: #8d96a1;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1f3f6; --surface: #ffffff; --surface-2: #eceff3; --line: #d8dde3; --fg: #121820; --muted: #5a6571; --faint: #8a949f;
  --accent: #1f6fe0; --accent-fg: #ffffff; --accent-soft: rgba(31, 111, 224, 0.12);
  --good: #1e8a5a; --good-soft: rgba(30, 138, 90, 0.12); --warn: #b07513; --warn-soft: rgba(176, 117, 19, 0.12); --bad: #c8382e;
  --plate-red: #c73a33; --plate-blue: #2f6fd6; --plate-yellow: #d2a21c; --plate-green: #2f9259; --plate-grey: #8d96a1;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 580px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; text-transform: uppercase; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.ok i { background: var(--good); }
.sync.busy i { background: var(--warn); }
.sync.err i { background: var(--bad); }

main { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.daynav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.daynav h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.05; font-weight: 700; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.daytitle { text-align: center; min-width: 0; }

.banner { border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); }
.banner button { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 8px 12px; font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.session-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.bad { background: var(--surface-2); color: var(--bad); }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.25s ease; }
.progress.good > span { background: var(--good); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.items { display: flex; flex-direction: column; gap: 10px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex.is-done { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.ex-h { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; }
.plate { width: 22px; height: 22px; border-radius: 50%; border: 6px solid var(--plate-grey); margin-top: 2px; background: transparent; }
.plate.red { border-color: var(--plate-red); }
.plate.blue { border-color: var(--plate-blue); }
.plate.yellow { border-color: var(--plate-yellow); }
.plate.green { border-color: var(--plate-green); }
.ex-t { min-width: 0; }
.part { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ex-t h3 { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ex-state { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ex-state.done { color: var(--good); }
.rx { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.rx-main { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: 0.01em; }
.rx-sub { font-size: 13px; color: var(--muted); }
.prev { font-size: 13px; color: var(--muted); }
.notes summary { font-size: 13px; color: var(--accent); cursor: pointer; list-style: none; }
.notes summary::-webkit-details-marker { display: none; }
.notes p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px 62px 44px; gap: 8px; align-items: center; }
.set.nw { grid-template-columns: 26px minmax(0, 1fr) 76px 44px; }
.set.chk { grid-template-columns: 26px minmax(0, 1fr) 30px 44px; }
.set.chk.kg { grid-template-columns: 26px minmax(0, 1fr) 44px; }
.how-mini { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: 13px; font-weight: 700; text-decoration: none; }
.howto { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.how { color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; padding: 6px 0; }
.demo { position: relative; width: 132px; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); padding: 0; flex: none; }
.demo.big { width: 100%; }
.demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.demo img + img { animation: demoflip 1.8s steps(1, end) infinite; }
@keyframes demoflip { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .demo img + img { animation: none; opacity: 0; } .demo.big img + img { opacity: 1; } }
.set.chk .tg { color: var(--fg); }
.set.chk.done .tg { color: var(--good); }
.set-h { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.set .n { font-weight: 700; color: var(--muted); text-align: center; }
.set .tg { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.set.done .tg, .set.done .n { color: var(--good); }
.field { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; font-variant-numeric: tabular-nums; font-size: 16px; text-align: center; }
.field::placeholder { color: var(--faint); }
.field.wide { text-align: left; }
.tick { width: 44px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--faint); }
.tick svg { width: 20px; height: 20px; }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.linkbtn { align-self: flex-start; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; font-size: 14px; }
.donebtn { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
.donebtn svg { width: 18px; height: 18px; }
.donebtn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
label.lab { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.kegels { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .pill { min-width: 44px; padding: 0 10px; }
.primary { height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 16px; padding: 0 18px; }
.secondary { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 0 16px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > * { flex: 1 1 140px; }
.result { font-size: 14px; }
.result b { font-family: var(--font-display); font-size: 20px; }

.weekhead { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.weekhead h1 { font-family: var(--font-display); font-size: 30px; text-align: center; }
.phasebar { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; }
.phasebar span { background: var(--surface-2); }
.phasebar span.on { background: var(--accent); }
.phasebar span.past { background: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); }
.daylist { display: flex; flex-direction: column; }
.dayrow { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.dayrow:first-child { border-top: 0; }
.dayrow .d { font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1.1; }
.dayrow .d small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.dayrow .s { font-weight: 600; font-size: 15px; min-width: 0; }
.dayrow.today { background: var(--accent-soft); border-radius: 10px; }

.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.goal { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.goal .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
.goal .v small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.charttip { font-size: 13px; color: var(--muted); min-height: 18px; }
.mile { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.mile:first-child { border-top: 0; }
.mile .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.mile .box svg { width: 16px; height: 16px; }
.mile[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: #fff; }

.foodgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.foodgrid div { background: var(--surface-2); border-radius: 12px; padding: 10px; }
.foodgrid b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
.foodgrid span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick .pill { font-weight: 500; }
.entries { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 1fr auto 36px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; }
.entry button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.custom { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 52px; gap: 6px; }
.custom .primary { height: 42px; padding: 0; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); }
td input { width: 68px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); text-align: center; font-variant-numeric: tabular-nums; }
details.guide { border-top: 1px solid var(--line); padding: 10px 0; }
details.guide:first-of-type { border-top: 0; }
details.guide summary { font-weight: 600; cursor: pointer; }
details.guide ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.timer { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 8px; }
.timer-in { max-width: 548px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
.timer-in b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.timer-in button { height: 38px; min-width: 44px; border-radius: 10px; border: 0; background: color-mix(in srgb, var(--bg) 14%, var(--fg)); color: var(--bg); font-weight: 700; padding: 0 10px; }
.timer-bar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 20%, var(--fg)); overflow: hidden; }
.timer-bar span { display: block; height: 100%; background: var(--accent); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 580px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

/* Start screen (Study or Exercise) and the Study checklist */
.brandrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.iconbtn.sm { width: 38px; height: 38px; border-radius: 10px; flex: none; }
.home { display: flex; flex-direction: column; gap: 14px; }
.home h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.05; font-weight: 700; }
.choice { display: grid; grid-template-columns: 56px minmax(0, 1fr) 20px; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 20px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.choice .ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.choice.study .ico { background: var(--warn-soft); color: var(--warn); }
.choice .ico svg { width: 30px; height: 30px; }
.choice b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.05; }
.choice .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.choice .chev { color: var(--faint); }
.choice .chev svg { width: 20px; height: 20px; }
.blockh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 2px 0; }
.blockh h2 { font-family: var(--font-display); font-size: 21px; font-weight: 700; }
.src { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: var(--accent); text-decoration: none; font-weight: 600; }
.ncrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.ncrow:first-child { border-top: 0; }
.ncrow .nn { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--muted); text-align: center; }
.ncrow b { font-weight: 600; overflow-wrap: anywhere; }
.ncrow .small { display: block; }
details.ncd { border-top: 1px solid var(--line); }
details.ncd:first-child { border-top: 0; }
details.ncd > summary { list-style: none; cursor: pointer; border-top: 0; }
details.ncd > summary::-webkit-details-marker { display: none; }
.ncbody { display: flex; flex-direction: column; gap: 10px; padding: 0 0 14px 44px; }
.field.area { height: auto; min-height: 120px; padding: 10px 12px; text-align: left; line-height: 1.45; resize: vertical; font-variant-numeric: normal; font-size: 15px; }
.set.part-done .tg { font-weight: 600; }
.gate { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.gate:first-child { border-top: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
