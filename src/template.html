<style>
/* Layout: one-column phone log. Sticky header, week strip of progress rings, one card per task, fixed bottom tabs.

:root {

  --c-olive: #90b627; --c-pink: #ed5b6c; --c-purple: #a66bff; --c-orange: #ff9f43; --c-grey: #8a8a8a;

  color-scheme: dark;

  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --surface: #f2f2f5; --surface-2: #e5e5ea; --line: #dcdce1; --fg: #111113; --muted: #6c6c72; --faint: #a1a1a8;
    --accent: #ffc800; --accent-fg: #000000; --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent); --link: color-mix(in srgb, var(--accent) 62%, #000);
    --good: #0fa87f; --good-soft: rgba(15, 168, 127, 0.14); --warn: #e08600; --warn-soft: rgba(224, 134, 0, 0.14); --bad: #e5484d;
    --c-grey: #9a9aa0;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #f2f2f5; --surface-2: #e5e5ea; --line: #dcdce1; --fg: #111113; --muted: #6c6c72; --faint: #a1a1a8;
  --accent: #ffc800; --accent-fg: #000000; --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent); --link: color-mix(in srgb, var(--accent) 62%, #000);
  --good: #0fa87f; --good-soft: rgba(15, 168, 127, 0.14); --warn: #e08600; --warn-soft: rgba(224, 134, 0, 0.14); --bad: #e5484d;
  --c-grey: #9a9aa0;

/* card colour; the check drawn on it is white, except black on yellow */

.c-blue { --c: var(--c-blue); } .c-olive { --c: var(--c-olive); } .c-pink { --c: var(--c-pink); } .c-purple { --c: var(--c-purple); }
.c-orange { --c: var(--c-orange); } .c-grey { --c: var(--c-grey); }

.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 580px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.ok i { background: var(--good); }
.sync.busy i { background: var(--warn); }
.sync.err i { background: var(--bad); }

main { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--font-display); font-weight: 800; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.daynav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.daynav h1 { font-family: var(--font-display); font-size: 26px; line-height: 1.1; font-weight: 800; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.daytitle { text-align: center; min-width: 0; }
/* Day header + week strip: each day is a ring that fills with the share of that day's plan you ticked */
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.dayhead h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-weight: 800; }

.dayhead .nav { display: flex; gap: 6px; flex: none; }
.dayhead .iconbtn { width: 38px; height: 38px; }
.wkstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wkday { border: 0; background: none; padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
.wkday:disabled { opacity: 0.35; cursor: default; }
.wkday { font-size: 13px; font-weight: 600; }
.wkday.today .dn { color: var(--fg); font-weight: 800; }
.ring { --p: 0; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); font-size: 15px; font-weight: 700;
  background: radial-gradient(closest-side, var(--bg) 74%, transparent 75% 100%), conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.wkday.on .ring b { background: var(--fg); color: var(--bg); }

.banner { border-radius: 16px; padding: 12px 14px; background: var(--accent-soft); font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); }
.banner button { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 8px 14px; font-weight: 700; }

.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.session-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.15; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.accent { background: var(--accent-soft); color: var(--link); }
.chip.bad { background: var(--surface-2); color: var(--bad); }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.25s ease; }
.progress.good > span { background: var(--good); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.items { display: flex; flex-direction: column; gap: 10px; }
.ex { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex.is-done { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c, var(--good)) 60%, transparent); }
.ex-h { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }

.plate { width: 40px; height: 40px; border-radius: 50%; background: color-mix(in srgb, var(--c, var(--c-grey)) 20%, var(--surface)); display: grid; place-items: center;
  color: var(--c, var(--c-grey)); font-weight: 800; font-size: 16px; line-height: 1; letter-spacing: -0.02em; }
.plate::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--c-grey)); }
.plate[data-g]::after { content: attr(data-g); width: auto; height: auto; background: none; }
.plate.ico::after { display: none; }
.plate svg { width: 20px; height: 20px; }

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .plate, :root:not([data-theme="dark"]) .set.done .n { color: color-mix(in srgb, var(--c, var(--c-grey)) 68%, #000); }
}
.ex-t { min-width: 0; }
.part { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.ex-t h3 { font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
/* Card state: a ring that fills as you tick (--p = percent), a solid check once done */
.ex-state { --p: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--fg); white-space: nowrap;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)) 78%, transparent 79% 100%), conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--surface-2) 0); }
.ex-state.done { background: var(--c, var(--good)); color: var(--on-c); }
.ex-state svg { width: 20px; height: 20px; }
.rx { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.rx-main { font-family: var(--font-display); font-size: 19px; font-weight: 800; }
.rx-sub { font-size: 13px; color: var(--muted); }
.prev { font-size: 13px; color: var(--muted); }
.notes summary { font-size: 13px; color: var(--link); font-weight: 600; cursor: pointer; list-style: none; }
.notes summary::-webkit-details-marker { display: none; }
.notes p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px 62px 44px; gap: 8px; align-items: center; }
.set.nw { grid-template-columns: 26px minmax(0, 1fr) 76px 44px; }
.set.chk { grid-template-columns: 26px minmax(0, 1fr) 30px 44px; }
.set.chk.kg { grid-template-columns: 26px minmax(0, 1fr) 44px; }
.how-mini { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 13px; font-weight: 800; text-decoration: none; }
.howto { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.how { color: var(--link); font-weight: 700; font-size: 14px; text-decoration: none; padding: 6px 0; }
.demo { position: relative; width: 132px; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); padding: 0; flex: none; }
.demo.big { width: 100%; }
.demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.demo img + img { animation: demoflip 1.8s steps(1, end) infinite; }
@keyframes demoflip { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .demo img + img { animation: none; opacity: 0; } .demo.big img + img { opacity: 1; } }
.set.chk .tg { color: var(--fg); }
.set.chk.done .tg { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.set-h { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); }
.set .n { font-weight: 800; color: var(--faint); text-align: center; }
.set .tg { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.set.done .tg, .set.done .n { color: var(--c, var(--good)); }
.field { width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; font-variant-numeric: tabular-nums; font-size: 16px; text-align: center; }
.field::placeholder { color: var(--faint); }
.field.wide { text-align: left; }
/* Ticks are circles: a ring in the card's colour with a faint check until done, then filled with that colour */
.tick { width: 38px; height: 38px; justify-self: center; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c, var(--muted)) 85%, transparent); background: transparent; display: grid; place-items: center; color: color-mix(in srgb, var(--c, var(--muted)) 70%, transparent); }
.tick svg { width: 18px; height: 18px; }
.tick[aria-pressed="true"] { background: var(--c, var(--good)); border-color: var(--c, var(--good)); color: var(--on-c); }
.tick:disabled { opacity: 0.45; }
.linkbtn { align-self: flex-start; border: 0; background: none; color: var(--link); font-weight: 700; padding: 4px 0; font-size: 14px; }
.donebtn { height: 44px; border-radius: 999px; border: 0; background: var(--surface-2); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; }
.donebtn svg { width: 18px; height: 18px; }
.donebtn[aria-pressed="true"] { background: var(--c, var(--good)); color: var(--on-c); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
label.lab { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.kegels { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--surface-2); font-weight: 700; font-size: 14px; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .pill { min-width: 44px; padding: 0 10px; }
.primary { height: 50px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 800; font-size: 16px; padding: 0 20px; }
.secondary { height: 50px; border-radius: 999px; border: 0; background: var(--surface-2); font-weight: 700; padding: 0 18px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > * { flex: 1 1 140px; }
.result { font-size: 14px; }
.result b { font-family: var(--font-display); font-size: 20px; font-weight: 800; }

.weekhead { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.weekhead h1 { font-family: var(--font-display); font-size: 26px; font-weight: 800; text-align: center; }
.phasebar { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; }
.phasebar span { background: var(--surface-2); }
.phasebar span.on { background: var(--accent); }
.phasebar span.past { background: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); }
.daylist { display: flex; flex-direction: column; }
.dayrow { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.dayrow:first-child { border-top: 0; }
.dayrow .d { font-family: var(--font-display); font-size: 16px; font-weight: 800; line-height: 1.1; }
.dayrow .d small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.dayrow .s { font-weight: 600; font-size: 15px; min-width: 0; }
.dayrow.today { background: var(--accent-soft); border-radius: 14px; }

.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.goal { background: var(--surface-2); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.goal .v { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1; }
.goal .v small { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 16px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.charttip { font-size: 13px; color: var(--muted); min-height: 18px; }
.mile { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.mile:first-child { border-top: 0; }
.mile .box { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.mile .box svg { width: 16px; height: 16px; }
.mile[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: var(--on-c); }

.foodgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.foodgrid div { background: var(--surface-2); border-radius: 16px; padding: 10px; }
.foodgrid b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 800; line-height: 1.1; }
.foodgrid span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick .pill { font-weight: 500; }
.entries { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 1fr auto 36px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; }
.entry button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.custom { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 52px; gap: 6px; }
.custom .primary { height: 42px; padding: 0; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); }
td input { width: 68px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); text-align: center; font-variant-numeric: tabular-nums; }
details.guide { border-top: 1px solid var(--line); padding: 10px 0; }
details.guide:first-of-type { border-top: 0; }
details.guide summary { font-weight: 600; cursor: pointer; }
details.guide ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.timer { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 8px; }
.timer-in { max-width: 548px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 20px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
.timer-in b { font-family: var(--font-display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.timer-in button { height: 38px; min-width: 44px; border-radius: 10px; border: 0; background: color-mix(in srgb, var(--bg) 14%, var(--fg)); color: var(--bg); font-weight: 700; padding: 0 10px; }
.timer-bar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 20%, var(--fg)); overflow: hidden; }

      signedOut("Signed out. Your log is still on this phone.");
    } else if (act === "auth-forgot") {
      var em = (document.getElementById("auth-email") || {}).value;
      if (!em) { state.authMsg = "Type your email above first, then tap Forgot password."; render(); return; }
      authCall("POST", "recover?redirect_to=" + redirectTo(), { email: em }).then(function () { state.authMsg = "Check your email for a reset link. Open it on this phone."; render(); },
        function (e) { state.authMsg = e.message || "Couldn’t send the reset email."; render(); });
    }
  });
  document.addEventListener("submit", function (ev) {
    var form = ev.target;
    if (form.dataset.form === "auth") {
      ev.preventDefault();
      var mode = (ev.submitter && ev.submitter.dataset.mode) || "signin";
      var email = document.getElementById("auth-email").value.trim(), pass = document.getElementById("auth-pass").value;
      state.authMsg = mode === "signup" ? "Creating your account…" : "Signing in…"; render();
      var call = mode === "signup" ? authCall("POST", "signup?redirect_to=" + redirectTo(), { email: email, password: pass }) : authCall("POST", "token?grant_type=password", { email: email, password: pass });
      call.then(function (j) {
        if (setSessionFrom(j)) { state.authMsg = ""; prefSet("skipAuth", null); render(); return ensureUser().then(syncNow).then(render); }
        state.authMsg = "Account created. Open the confirmation email on this phone, then come back and sign in.";
        render();
      }).catch(function (e) {
        state.authMsg = /invalid login/i.test(e.message || "") ? "Wrong email or password." : /not confirmed/i.test(e.message || "") ? "Confirm your email first: open the link Supabase sent you, then sign in." : (e.message || "Couldn’t reach the server. Check your connection.");
        render();
      });
      return;
    }
    if (form.dataset.form === "newpass") {
      ev.preventDefault();
      var np = document.getElementById("new-pass").value;
      validToken().then(function (tok) { return authCall("PUT", "user", { password: np }, tok); }).then(function () { state.recovery = false; state.authMsg = "Password updated."; render(); },
        function (e) { state.authMsg = e.message || "Couldn’t update the password."; render(); });
      return;
    }
    if (form.dataset.form !== "food") return;
    ev.preventDefault();
    var n = document.getElementById("food-name").value.trim(), p = num(document.getElementById("food-p").value), k = num(document.getElementById("food-k").value);
    if (!n || p == null) return;
    var d = ensureDay(state.date); d.food.entries.push({ n: n, p: p, kcal: k }); touchDay(state.date); render();
  });

  /* ------------------------------------------------------------ boot */
  /* Opening the app lands on the Study / Exercise chooser; a #tab in the URL (e.g. after a reload) goes straight there. */
  var hash = (location.hash || "").replace("#", "");
  if (["today", "plan", "progress", "food", "me"].indexOf(hash) >= 0) { state.section = "exercise"; state.tab = hash; }
  else if (hash === "study" || hash.indexOf("study-") === 0) {
    state.section = "study"; state.stab = hash === "study" ? "today" : hash.slice(6);
    if (["today", "week", "progress", "lc", "me"].indexOf(state.stab) < 0) state.stab = "today";
  } else { state.section = "home"; state.tab = prefGet("tab") || "today"; }
  state.sdate = pickStudyDate();
  pickInitialDate();
  applyLook();
  render();
  startSync();
})();
</script>
